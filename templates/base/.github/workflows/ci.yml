# Tiered CI (decision of the "Acceptance" layer): a green `quick` on the PR is the entry to acceptance
# and the condition for merge-feature.sh; `full` and `browser` are the release gate on a release tag.
#
# Why tiers rather than the full matrix on every push: the full matrix on every push of a
# feature branch turns out expensive in time and Actions minutes,
# and e2e per CODING_STANDARDS is a release gate, not a gate on every commit. The quick tier
# repeats pre-push (unit + integration + api without a browser), the heavy ones run on the
# `v*` tag and manually (workflow_dispatch).
#
# Why a secret scan on PRs: a preview-environment password written into a committed file
# stays in git history — removing it from the file no longer removes it. Scanning the PR
# diff catches this before the merge, while history does not need rewriting.
#
# Fill in on deployment: steps for the project's stack and the main branch name. Every stub step
# fails (::error:: + exit 1) until it is replaced — an unfilled CI must not look green, because
# merge-feature.sh merges on green CI.
#
# Supply chain: the workflow token is read-only (permissions below; widen per job only where a
# job needs it), third-party actions are pinned to a full commit SHA with the version in a comment
# — a moved tag cannot change what runs. Update a pin: git ls-remote https://github.com/<owner>/<action> refs/tags/<version>

name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches-ignore: [<main>]   # feature branches; main is checked via the PR
    tags: ['v*']                # release tag → full + browser
  workflow_dispatch:

jobs:
  # Quick tier: on every PR and feature branch push. No browser.
  quick:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup runtime
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: setup: actions/setup-python / setup-node / ruby …"
          exit 1
      - name: Install deps
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: install: pip install -e '.[dev]' / npm ci / bundle install"
          exit 1
      - name: Lint
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: lint: ruff / eslint / rubocop"
          exit 1
      - name: Tests — unit + integration + api (no browser)
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: tests: pytest tests/unit tests/integration tests/api -q -m 'not browser'"
          exit 1
      - name: Test pyramid ratchet
        # The base share of the declared profile (unit-first: unit, contract-first: integration)
        # must not drop relative to .harness/pyramid-baseline.json
        # (the same contract as in .githooks/pre-push). No scripts/pyramid.py in the project —
        # delete the step; no baseline — the script warns and exits with 0.
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: pyramid: python scripts/pyramid.py --ratchet"
          exit 1

  # Full tier: the whole matrix — manually and on a release tag.
  full:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup runtime
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: setup: actions/setup-python / setup-node / ruby …"
          exit 1
      - name: Install deps
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: install: pip install -e '.[dev]' / npm ci / bundle install"
          exit 1
      - name: Lint
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: lint: ruff / eslint / rubocop"
          exit 1
      - name: Tests — full matrix
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: tests: pytest / npm test / rspec — ALL except browser (it has its own tier)"
          exit 1

  # Browser tier: e2e — release gate (CODING_STANDARDS), manually and on a release tag.
  browser:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup runtime
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: setup: actions/setup-python / setup-node …"
          exit 1
      - name: Install deps
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: install: pip install -e '.[dev]' playwright pytest-playwright"
          exit 1
      - name: Install Chromium
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: browsers: python -m playwright install --with-deps chromium"
          exit 1
      - name: Tests — e2e
        run: |
          echo "::error::ci.yml is not filled in — replace this step with: e2e: pytest tests/e2e -m e2e"
          exit 1

  # Secret scan of the PR diff: only verified findings, to avoid noise.
  secret-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # trufflehog compares base..head — history is needed
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
